org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 本 App 自身零 androidx 运行时依赖（只用平台 API + apksig）。
# 这里必须为 true，仅仅是因为 Robolectric 的测试类路径会带进 androidx.test，
# 而 AGP 在 useAndroidX=false 时会直接拒绝解析。
# 因为那些依赖是 testImplementation，release APK 里不会被打进去。
android.useAndroidX=true
android.nonTransitiveRClass=true
